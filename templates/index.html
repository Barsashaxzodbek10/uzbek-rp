<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>UZBEK RP</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#78a957;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    display:block;
}

#top{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:58px;
    background:rgba(8,12,9,.94);
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    z-index:10;
}

#logo{
    font-size:20px;
    font-weight:900;
}

.stats{
    display:flex;
    gap:7px;
}

.stat{
    background:#252c25;
    border-radius:10px;
    padding:8px 10px;
    font-size:13px;
    font-weight:bold;
}

#m{
    position:fixed;
    left:14px;
    top:70px;
    width:58px;
    height:58px;
    border-radius:50%;
    border:4px solid white;
    background:#222;
    color:white;
    font-size:25px;
    font-weight:900;
    z-index:20;
}

#joystick{
    position:fixed;
    left:20px;
    bottom:18px;
    width:140px;
    height:140px;
    border-radius:50%;
    background:rgba(30,60,20,.5);
    border:3px solid rgba(255,255,255,.35);
    z-index:20;
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    width:64px;
    height:64px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#d5d9d2;
    border:4px solid white;
    box-shadow:0 5px 15px #0008;
}

#controls{
    position:fixed;
    right:15px;
    bottom:18px;
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:20;
}

.ctrl{
    width:110px;
    height:58px;
    border:0;
    border-radius:17px;
    color:white;
    font-size:17px;
    font-weight:900;
    box-shadow:0 5px 12px #0006;
}

#gas{
    background:#18ad4b;
}

#brake{
    background:#ed3434;
}

#exit{
    background:#ed8b19;
    display:none;
}

#enter{
    position:fixed;
    right:15px;
    bottom:18px;
    width:125px;
    height:58px;
    border:0;
    border-radius:17px;
    background:#18ad4b;
    color:white;
    font-size:16px;
    font-weight:900;
    z-index:20;
    display:none;
}

#speed{
    position:fixed;
    top:70px;
    right:12px;
    background:#111c;
    color:white;
    padding:8px 12px;
    border-radius:10px;
    font-weight:bold;
    z-index:10;
    display:none;
}

#menu{
    position:fixed;
    inset:0;
    background:#000b;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
}

.menuBox{
    width:300px;
    padding:22px;
    border-radius:22px;
    background:#202420;
}

.menuTitle{
    color:white;
    text-align:center;
    font-size:25px;
    font-weight:900;
    margin-bottom:15px;
}

.menuButton{
    width:100%;
    height:52px;
    margin-top:9px;
    border:0;
    border-radius:13px;
    background:#383d38;
    color:white;
    font-size:17px;
    font-weight:bold;
}

#close{
    background:#b92f2f;
}

#msg{
    position:fixed;
    left:50%;
    top:70%;
    transform:translate(-50%,-50%);
    background:#000c;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    font-weight:bold;
    opacity:0;
    z-index:200;
    transition:.2s;
}

@media(max-width:700px){
    #top{height:50px}
    #logo{font-size:16px}
    .stat{font-size:11px;padding:6px}
    #m{top:62px;width:52px;height:52px}
    #joystick{
        width:125px;
        height:125px;
        left:15px;
        bottom:14px;
    }
    #stick{
        width:58px;
        height:58px;
    }
    #controls{
        right:12px;
        bottom:14px;
    }
    .ctrl{
        width:100px;
        height:55px;
    }
    #enter{
        right:12px;
        bottom:14px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="top">
    <div id="logo">🇺🇿 UZBEK RP</div>

    <div class="stats">
        <div class="stat">💰 <span id="money">500000</span> so‘m</div>
        <div class="stat">⛽ <span id="fuel">97</span>%</div>
    </div>
</div>

<button id="m">M</button>

<div id="speed">0 km/h</div>

<div id="joystick">
    <div id="stick"></div>
</div>

<div id="controls">
    <button id="exit" class="ctrl">TUSHISH</button>
    <button id="gas" class="ctrl">GAZ</button>
    <button id="brake" class="ctrl">TORMOZ</button>
</div>

<button id="enter">O‘TIRISH</button>

<div id="msg"></div>

<div id="menu">
    <div class="menuBox">
        <div class="menuTitle">🇺🇿 UZBEK RP</div>
        <button class="menuButton">🗺️ XARITA</button>
        <button class="menuButton">⚙️ SOZLAMALAR</button>
        <button id="close" class="menuButton">❌ YOPISH</button>
    </div>
</div>
